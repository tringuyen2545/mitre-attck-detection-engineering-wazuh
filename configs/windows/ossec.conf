<!--
  =============================================================================
  Cấu hình Wazuh Agent trên Windows Server 2019 (Victim Windows: 192.168.70.101)
  Đường dẫn: C:\Program Files (x86)\ossec-agent\ossec.conf
  =============================================================================
-->
<ossec_config>
  <client>
    <server>
      <address>192.168.70.100</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <crypto_method>aes</crypto_method>
    <notify_time>10</notify_time>
    <time-reconnect>60</time-reconnect>
    <auto_restart>yes</auto_restart>
  </client>

  <!-- Thu thập kênh sự kiện Sysmon chuyên sâu (Bắt buộc cho Event ID 1, 3, 10, 11) -->
  <localfile>
    <location>Microsoft-Windows-Sysmon/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- Thu thập kênh sự kiện Security (Audit log, logon, process creation 4688, log cleared 1102) -->
  <localfile>
    <location>Security</location>
    <log_format>eventchannel</log_format>
    <query>Event/System[EventID != 5145 and EventID != 5156 and EventID != 5157]</query>
  </localfile>

  <!-- Thu thập kênh sự kiện System và Application -->
  <localfile>
    <location>System</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <localfile>
    <location>Application</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- Thu thập kênh PowerShell Script Block Logging (Phục vụ T1486 Ransomware) -->
  <localfile>
    <location>Microsoft-Windows-PowerShell/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- Cấu hình File Integrity Monitoring (Syscheck) -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>300</frequency>
    <directories check_all="yes" realtime="yes">C:\Windows\System32\Tasks</directories>
    <directories check_all="yes" realtime="yes">C:\Windows\Temp</directories>
  </syscheck>
</ossec_config>
