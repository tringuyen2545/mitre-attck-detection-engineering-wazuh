<!--
  =============================================================================
  Cấu hình Wazuh Agent trên AlmaLinux 10 (Victim Linux: 192.168.70.102)
  Đường dẫn: /var/ossec/etc/ossec.conf
  =============================================================================
-->
<ossec_config>
  <client>
    <server>
      <address>192.168.70.100</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <crypto_method>aes</crypto_method>
    <notify_time>10</notify_time>
    <time-reconnect>60</time-reconnect>
    <auto_restart>yes</auto_restart>
  </client>

  <!-- Thu thập nhật ký Auditd (Bắt buộc cho quy tắc syscall execve & audit.key) -->
  <localfile>
    <log_format>audit</log_format>
    <location>/var/log/audit/audit.log</location>
  </localfile>

  <!-- Thu thập nhật ký hệ thống Syslog / Secure -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/secure</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/messages</location>
  </localfile>

  <!-- Cấu hình File Integrity Monitoring (FIM / Syscheck) theo thời gian thực -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>300</frequency>
    <scan_on_start>yes</scan_on_start>
    
    <!-- Giám sát Realtime các thư mục quản trị hệ thống trọng yếu -->
    <directories check_all="yes" realtime="yes">/etc/systemd/system,/etc/sudoers.d,/etc/ssh</directories>
    <directories check_all="yes" realtime="yes">/etc/cron.d,/var/www/html</directories>

    <!-- Đồng bộ hóa tệp tin nhạy cảm -->
    <synchronization>
      <enabled>yes</enabled>
      <interval>5m</interval>
    </synchronization>
  </syscheck>
</ossec_config>
